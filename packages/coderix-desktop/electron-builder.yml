appId: com.coderix.desktop
productName: Coderix
copyright: Copyright © 2026 Coderix Contributors
electronVersion: 34.5.8

directories:
  output: release

files:
  - dist/**/*
  - node_modules/bytenode/**/*
  - node_modules/node-pty/**/*
  - '!**/*.map'

asar: true
asarUnpack:
  - '**/*.node'
  - '**/spawn-helper'

# node-pty ships N-API prebuilds (ABI-stable across Node/Electron) — no rebuild.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - universal
  artifactName: ${productName}-${version}-${arch}.${ext}
